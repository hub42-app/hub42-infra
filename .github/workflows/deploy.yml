name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all, api, admin, crm, customer, scanner, landing)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api
          - admin
          - crm
          - customer
          - scanner
          - landing

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /root/hub42
            if [ "${{ github.event.inputs.service }}" = "all" ]; then
              echo "Deploying all services..."
              ./deploy.sh --skip-validation
            else
              echo "Deploying ${{ github.event.inputs.service }}..."
              ./deploy.sh -s ${{ github.event.inputs.service }} --skip-validation
            fi

      - name: Verify deployment
        run: |
          echo "Deployment complete. Services should be accessible at:"
          echo "  API: https://api.hub42.app"
          echo "  Business Portal: https://crm.hub42.app"
          echo "  Admin Portal: https://admin.hub42.app"
          echo "  Customer Portal: https://portal.hub42.app"
          echo "  Scanner: https://scan.hub42.app"
          echo "  Landing: https://hub42.app"
