version: '3.8'

services:
  # ============================================================================
  # Reverse Proxy (Dev - на локальному порту 3000)
  # ============================================================================
  caddy:
    image: caddy:latest
    container_name: hub42-caddy
    ports:
      - "3000:8080"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - hub42-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hub42-postgres
    environment:
      POSTGRES_DB: hub42
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d hub42"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - hub42-network

  # ============================================================================
  # Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: hub42-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - hub42-network

  # ============================================================================
  # Backend API (Dev - Maven hot reload)
  # ============================================================================
  backend:
    build:
      context: ../api
      dockerfile: Dockerfile.dev
    container_name: hub42-backend
    ports:
      - "8081:8081"
    volumes:
      - ../api/src:/app/src:ro
      - ../api/pom.xml:/app/pom.xml:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hub42
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_RATE: ${SENTRY_TRACES_RATE}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_FROM: ${MAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL:-http://hub42.local:3000}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://hub42.local:3000}
      CORS_ALLOWED_ORIGINS: "http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.16.*.*:*,http://172.17.*.*:*,http://172.18.*.*:*,http://172.19.*.*:*,http://172.2*.*.*:*,http://172.30.*.*:*,http://172.31.*.*:*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hub42-network

  # ============================================================================
  # Frontend: CRM Portal (Dev)
  # ============================================================================
  business-portal:
    build:
      context: ../crm
      dockerfile: Dockerfile.dev
    container_name: hub42-business-portal
    ports:
      - "5173:5173"
    volumes:
      - ../crm/src:/app/src:ro
    environment:
      VITE_API_URL: http://hub42-backend:8081
    networks:
      - hub42-network

  # ============================================================================
  # Frontend: Admin Portal (Dev)
  # ============================================================================
  admin-portal:
    build:
      context: ../admin
      dockerfile: Dockerfile.dev
    container_name: hub42-admin-portal
    ports:
      - "5175:5175"
    volumes:
      - ../admin/src:/app/src:ro
    environment:
      VITE_API_URL: http://hub42-backend:8081
    networks:
      - hub42-network

  # ============================================================================
  # Frontend: Customer Portal (Dev)
  # ============================================================================
  customer-portal:
    build:
      context: ../customer
      dockerfile: Dockerfile.dev
    container_name: hub42-customer-portal
    ports:
      - "5174:5174"
    volumes:
      - ../customer/src:/app/src:ro
    environment:
      VITE_API_URL: http://hub42-backend:8081
    networks:
      - hub42-network

  # ============================================================================
  # Frontend: Landing (Dev)
  # ============================================================================
  landing:
    build:
      context: ../landing
      dockerfile: Dockerfile.dev
    container_name: hub42-landing
    ports:
      - "5177:5177"
    volumes:
      - ../landing/src:/app/src:ro
    environment:
      VITE_THEME: hybrid
      VITE_DEV_PORT: 5177
    networks:
      - hub42-network

  # ============================================================================
  # Frontend: Scanner (Dev - nginx build)
  # ============================================================================
  scanner:
    build:
      context: ../scanner
      dockerfile: Dockerfile
    container_name: hub42-scanner
    ports:
      - "5176:5176"
    environment:
      VITE_API_URL: http://hub42-backend:8081
    networks:
      - hub42-network

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  hub42-network:
    driver: bridge
