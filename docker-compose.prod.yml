version: '3.8'

services:
  # ============================================================================
  # Reverse Proxy + SSL (Caddy)
  # ============================================================================
  caddy:
    image: caddy:latest
    container_name: hub42-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - hub42-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ============================================================================
  # Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hub42-postgres
    environment:
      POSTGRES_DB: hub42
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d hub42"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hub42-network
    restart: unless-stopped

  # ============================================================================
  # Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: hub42-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hub42-network
    restart: unless-stopped

  # ============================================================================
  # Backend API
  # ============================================================================
  backend:
    build:
      context: ../api
      dockerfile: Dockerfile.local-prod
    container_name: hub42-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hub42
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_RATE: ${SENTRY_TRACES_RATE}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_FROM: ${MAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL}
      CORS_ALLOWED_ORIGINS: "https://hub42.app,https://*.hub42.app"
    labels:
      app: hub42-backend
      tier: backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/v3/api-docs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - hub42-network
    restart: unless-stopped

  # ============================================================================
  # Frontend: CRM Portal
  # ============================================================================
  business-portal:
    build:
      context: ../crm
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    container_name: hub42-business-portal
    ports: []
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hub42-network
    restart: unless-stopped

  # ============================================================================
  # Frontend: Admin Portal
  # ============================================================================
  admin-portal:
    build:
      context: ../admin
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    container_name: hub42-admin-portal
    ports: []
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hub42-network
    restart: unless-stopped

  # ============================================================================
  # Frontend: Customer Portal
  # ============================================================================
  customer-portal:
    ports: []
    build:
      context: ../customer
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    container_name: hub42-customer-portal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hub42-network
    restart: unless-stopped

  # ============================================================================
  # Frontend: Landing (Production build with nginx)
  # ============================================================================
  landing:
    ports: []
    build:
      context: ../landing
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_THEME: hybrid
    container_name: hub42-landing
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - hub42-network
    restart: unless-stopped

  # ============================================================================
  # Frontend: Scanner
  # ============================================================================
  scanner:
    ports: []
    build:
      context: ../scanner
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: hub42-scanner
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hub42-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  hub42-network:
    driver: bridge
